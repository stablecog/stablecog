name: 'Setup Environment Variables'
description: 'Sets up common environment variables for the workflow'

outputs:
  SHORT_SHA:
    description: 'Short SHA of the commit'
    value: ${{ steps.set_env.outputs.SHORT_SHA }}
  BRANCH_NAME:
    description: 'Name of the branch'
    value: ${{ steps.set_env.outputs.BRANCH_NAME }}
  COMMIT_MSG:
    description: 'Commit message'
    value: ${{ steps.set_env.outputs.COMMIT_MSG }}

runs:
  using: 'composite'
  steps:
    - name: Set environment variables
      id: set_env
      shell: bash
      # Passed through env so quotes, $() or backticks in commit messages can't break or run in the script
      env:
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        if [ "${{ github.event_name }}" != 'pull_request' ]; then
          echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" >> $GITHUB_OUTPUT
        else
          echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF} | tr / -)" >> $GITHUB_OUTPUT
        fi
        # First line only, multi-line values (squash merge messages) break $GITHUB_OUTPUT
        echo "COMMIT_MSG=$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n 1 | tr -d \'\\\")" >> $GITHUB_OUTPUT
