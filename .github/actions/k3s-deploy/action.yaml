name: Deploy to Kubernetes
description: Deploy to Kubernetes
inputs:
  image:
    description: Image to deploy
    required: true
  kube_config:
    description: base64 encoded kube config
    required: true
  webhook-url:
    description: Discord Webhook URL
    required: true
  embed-title:
    description: Title of the embed
    required: true
runs:
  using: composite
  steps:
    - name: Send Discord Webhook
      if: ${{ inputs.embed-title != '' }}
      uses: ./.github/actions/discord-webhook
      with:
        webhook-url: ${{ inputs.webhook-url }}
        embed-color: 15105570
        embed-title: '[sc-web] ${{ inputs.embed-title }}'
        embed-description: '```Deploy Started```'

    - uses: azure/setup-kubectl@v4

    - name: Deploy image to k8s cluster
      working-directory: ./k8s
      shell: bash
      env:
        KUBE_CONFIG_DATA: ${{ inputs.kube_config }}
      run: |
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        sed -i "s|image: replaceme|image: ${{ inputs.image }}|" deployment.yaml
        kubectl apply -k .
        kubectl -n prod-stablecog rollout status deployment/sc-web-deployment --timeout=10m

    - name: Send Discord Webhook
      if: ${{ failure() && inputs.embed-title != '' }}
      uses: ./.github/actions/discord-webhook
      with:
        webhook-url: ${{ inputs.webhook-url }}
        embed-title: '[sc-web] ${{ inputs.embed-title }}'
        embed-color: 15548997
        embed-description: '```🚨 Deploy Failed 🚨```'

    - name: Send Discord Webhook
      if: ${{ success() && inputs.embed-title != '' }}
      uses: ./.github/actions/discord-webhook
      with:
        webhook-url: ${{ inputs.webhook-url }}
        embed-title: '[sc-web] ${{ inputs.embed-title }}'
        embed-color: 5763719
        embed-description: '```Deployed```'
